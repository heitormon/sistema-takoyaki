services:
  takoyaki:
    build:
      context: .
      dockerfile: dockerfile
      target: production
    container_name: takoyaki
    restart: unless-stopped
    ports:
      - "80:3000"
    volumes:
      - ./data:/app/data

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      TZ: "${TZ:-America/Sao_Paulo}"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD:?Defina PIHOLE_PASSWORD antes de iniciar}"
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
